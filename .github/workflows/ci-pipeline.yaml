name: Student Depression CI

on:
  push:
    branches:
      - main
      - ci/aws-deploy
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

jobs:
  build:
    name: Testing
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalacion de dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v

      - name: Imprimir mensaje de verificacion
        run: |
          echo "=================================================="
          echo "Pipeline de CI v1.0 ejecutado exitosamente"
          echo "Validando integracion en la rama: ${{ github.ref }}"
          echo "Tests ejecutados correctamente."
          echo "Entorno y dependencias instaladas correctamente."
          echo "=================================================="

  deploy:
    name: Deploy a EC2
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Deploy a EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_FINGERPRINT }}
          port: 22
          command_timeout: 15m

          script: |
            set -eu

            echo "Deploy iniciado"

            if [ ! -d "ml-student-depression-devops/.git" ]; then
              git clone https://github.com/ipynbenja/ml-student-depression-devops.git
            fi

            cd ml-student-depression-devops

            git fetch origin
            git reset --hard origin/main

            echo "Construyendo imagen Docker"
            sudo docker build -t student-depression-app:latest .

            echo "Imagen Docker construida correctamente"
            sudo docker images student-depression-app

            echo "Deploy terminado"