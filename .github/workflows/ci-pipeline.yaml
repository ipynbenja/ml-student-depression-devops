name: Student Depression CI

on:
  push:
    branches:
      - main
      - feature/docker-compose-aws
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

jobs:
  build:
    name: Testing
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalacion de dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v

      - name: Validar configuracion Docker Compose
        run: docker compose config -q

      - name: Imprimir mensaje de verificacion
        run: |
          echo "=================================================="
          echo "Pipeline de CI v1.0 ejecutado exitosamente"
          echo "Rama: ${{ github.ref_name }}"
          echo "Tests ejecutados correctamente."
          echo "=================================================="

  deploy:
    name: Deploy a EC2
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/docker-compose-aws')

    concurrency:
      group: student-depression-ec2-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy a EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: BRANCH
          script: |
            set -eu

            echo "Deploy iniciado para la rama: $BRANCH"

            APP_DIR="$HOME/ml-student-depression-devops"
            REPO_URL="https://github.com/ipynbenja/ml-student-depression-devops.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "Verificando Docker y Docker Compose"
            sudo docker --version
            sudo docker compose version

            echo "Validando configuracion de Docker Compose"
            sudo docker compose config -q

            echo "Deteniendo servicios anteriores y eliminando contenedores huerfanos"
            sudo docker compose down --remove-orphans --timeout 30 || true

            echo "Construyendo e iniciando la aplicacion"
            sudo docker compose up -d --build --remove-orphans

            echo "Verificando servicios desplegados"
            sudo docker compose ps

            echo "Ultimos registros de la aplicacion"
            sudo docker compose logs --tail=50

            echo "Deploy terminado para la rama: $BRANCH"