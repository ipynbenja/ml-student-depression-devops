name: CI/CD ML Student Depression

on:
  push:
    branches:
      - main

jobs:
  tests:
    name: Ejecutar tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar tests
        run: pytest -v

  deploy:
    name: Deploy a EC2
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_FINGERPRINT }}
          port: 22
          command_timeout: 15m
          script: |
            set -eu

            echo "Deploy iniciado"

            APP_DIR="$HOME/ml-student-depression-devops"
            REPO_URL="https://github.com/ipynbenja/ml-student-depression-devops.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch main "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Construyendo imagen Docker"
            sudo docker build -t student-depression-app:latest .

            echo "Reiniciando aplicación"
            sudo docker rm -f student-depression-app 2>/dev/null || true

            sudo docker run -d \
              --name student-depression-app \
              --restart unless-stopped \
              -p 8000:8000 \
              -p 8501:8501 \
              student-depression-app:latest

            echo "Esperando que la API esté disponible"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/ >/dev/null; then
                echo "API disponible"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "La API no respondió a tiempo"
                sudo docker logs student-depression-app
                exit 1
              fi

              sleep 2
            done

            echo "Deploy terminado"
            sudo docker ps --filter name=student-depression-app