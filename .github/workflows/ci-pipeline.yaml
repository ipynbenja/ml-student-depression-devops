name: Student Depression CI/CD

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  # Integración continua
  build:
    name: CI - Tests automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Ejecutar pruebas automatizadas
        run: python -m pytest -v

      - name: Confirmar CI exitoso
        run: echo "Todas las pruebas han pasado."

  # Despliegue continuo en EC2
  deploy:
    name: CD - Despliegue AWS EC2
    runs-on: ubuntu-latest
    needs: build

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Desplegar mediante SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_FINGERPRINT }}
          port: 22
          command_timeout: 15m

          script: |
            set -eu

            APP_DIR="$HOME/student-depression"
            REPO_URL="https://github.com/ipynbenja/ml-student-depression-devops.git"
            CONTAINER="student-depression-app"
            PREVIOUS="student-depression-app-previous"
            IMAGE="student-depression-app:latest"

            echo "Iniciando despliegue..."

            # Obtener el código fuente
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            git fetch origin main
            git reset --hard origin/main

            # Construir antes de detener la versión activa
            sudo docker build -t "$IMAGE" .

            # Limpiar un contenedor anterior de rollback
            sudo docker rm -f "$PREVIOUS" 2>/dev/null || true

            # Renombrar el contenedor activo para conservarlo
            HAD_PREVIOUS=0

            if sudo docker container inspect "$CONTAINER" \
              >/dev/null 2>&1; then
              sudo docker rename "$CONTAINER" "$PREVIOUS"
              HAD_PREVIOUS=1
              sudo docker stop "$PREVIOUS" || true
            fi

            # Iniciar la nueva versión
            if ! sudo docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 8000:8000 \
              -p 8501:8501 \
              "$IMAGE"; then

              echo "No se pudo iniciar el nuevo contenedor."

              if [ "$HAD_PREVIOUS" -eq 1 ]; then
                sudo docker rename "$PREVIOUS" "$CONTAINER"
                sudo docker start "$CONTAINER"
              fi

              exit 1
            fi

            # Comprobar que FastAPI responde
            HEALTHY=0

            for attempt in $(seq 1 20); do
              if curl -fsS \
                http://127.0.0.1:8000/ >/dev/null; then
                HEALTHY=1
                break
              fi

              sleep 3
            done

            # Recuperar la versión anterior si falla la comprobación
            if [ "$HEALTHY" -ne 1 ]; then
              echo "La API no responde. Consultando logs..."
              sudo docker logs "$CONTAINER" || true

              sudo docker rm -f "$CONTAINER" || true

              if [ "$HAD_PREVIOUS" -eq 1 ]; then
                sudo docker rename "$PREVIOUS" "$CONTAINER"
                sudo docker start "$CONTAINER"
              fi

              exit 1
            fi

            # Eliminar la versión anterior tras validar la nueva
            if [ "$HAD_PREVIOUS" -eq 1 ]; then
              sudo docker rm -f "$PREVIOUS"
            fi

            echo "Despliegue completado correctamente."