name: Student Depression CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

jobs:
  # PRUEBAS UNITARIAS Y COBERTURA
  test:
    name: Test y Coberturas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@eef61447b9340f1a14c330df32d3999960dd668b # v4.2.2
        with:
          fetch-depth: 0 

      - name: Configurar Python 3.12
        uses: actions/setup-python@0d103c31281d738a5592852fb402f0fc981507d7 # v5.3.0
        with:
          python-version: "3.12"

      - name: Configurar Cache de Pip
        uses: actions/cache@6849a6489940f00c2f30c0fb92c62741adb5776c # v4.2.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalacion de dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar tests con reporte de cobertura
        env:
          PYTHONPATH: .
        run: python -m pytest --cov=. --cov-report=xml -v

      # ANÁLISIS DE CÓDIGO CON SONARCLOUD 
      - name: Escaneo con SonarCloud 
        uses: SonarSource/sonarqube-scan-action@bfd4e558cda28cda6b5debaf04d5ff72247d28d9 # v4.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ESCANEO DE SEGURIDAD Y DEPENDENCIAS CON SNYK
  security:
    name: Escaneo de seguridad (Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@eef61447b9340f1a14c330df32d3999960dd668b # v4.2.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@0d103c31281d738a5592852fb402f0fc981507d7 # v5.3.0
        with:
          python-version: "3.12"

      - name: Configurar Cache de Pip
        uses: actions/cache@6849a6489940f00c2f30c0fb92c62741adb5776c # v4.2.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalacion de dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Escanear dependencias de Python con Snyk
        uses: snyk/actions/python-3.12@cd4892415d86ef8e13769c84e1cc5f061e38b30f # v0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

      - name: Construir imagen Docker para escaneo con Snyk
        run: docker build -t ml-student-depression:latest .

      - name: Escanear Dockerfile con Snyk
        uses: snyk/actions/docker@cd4892415d86ef8e13769c84e1cc5f061e38b30f # v0.4.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: "ml-student-depression:latest"
          args: --file=Dockerfile --severity-threshold=high
        continue-on-error: false

  # DESPLIEGUE A EC2
  deploy:
    name: Deploy a EC2
    runs-on: ubuntu-latest
    needs: [test, security]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: student-depression-ec2-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy a EC2 via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7e0b681bc10588788330752e55a3 # v1.0.3
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: BRANCH
          script: |
            set -eu

            echo "Deploy iniciado para la rama: $BRANCH"

            APP_DIR="$HOME/ml-student-depression-devops"
            REPO_URL="https://github.com/ipynbenja/ml-student-depression-devops.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "Verificando Docker y Docker Compose"
            sudo docker --version
            sudo docker compose version

            echo "Validando configuracion de Docker Compose"
            sudo docker compose config -q

            echo "Deteniendo servicios anteriores y eliminando contenedores huerfanos"
            sudo docker compose down --remove-orphans --timeout 30 || true

            echo "Construyendo e iniciando la aplicacion"
            sudo docker compose up -d --build --remove-orphans

            echo "Esperando disponibilidad de la API"

            for i in $(seq 1 12); do
              if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
                echo "API disponible"
                break
              fi

              if [ "$i" -eq 12 ]; then
                echo "ERROR: la API no responde"
                sudo docker compose logs --tail=100
                exit 1
              fi

              sleep 5
            done

            echo "Verificando servicios desplegados"
            sudo docker compose ps

            echo "Ultimos registros de la aplicacion"
            sudo docker compose logs --tail=50

            echo "Deploy terminado para la rama: $BRANCH"